# research/ —— investment-research 的取数管道配置
#
# 数据包契约（与 .claude/skills/research-data-sources/SKILL.md §四 一致，两处不能漂移）：
#   13F  → data/research/13f_<YYYYQn>.json
#   宏观 → data/research/macro.json
# 数据源接口契约与坑位见 SKILL.md（EDGAR 的 UA/限频、13F 的 45 天窗口、FRED 序列表）。

edgar:
  # SEC Fair Access：User-Agent 必须是「名字 邮箱@域名」（2026-10-12 实踩：
  # 仓库 URL 式 UA → 403；*@users.noreply.github.com 也 403，该模式已被 SEC 拉黑）。
  # 真实邮箱放 .env 的 EDGAR_CONTACT_EMAIL（同 FRED_API_KEY，不进仓库）；未配置时退占位符并警告。
  user_agent_name: "moomoo-watch research pipeline"
  # contact_email: "you@example.com"   # 仅当不想用 .env 时才填这里（会被公开）

fetch:
  quarters_back: 2        # 每家机构取最近几个季度的 13F（供 agent 对比算 新买/加仓/减仓/清仓）
  top_n: 50               # 每家每季保留市值前 N 大持仓（agent 只需要前十 + 交集余量）
  fred_obs_limit: 60      # 每条 FRED 序列取最近 N 条观测
  min_interval_sec: 0.13  # EDGAR 限频 10 req/s → 守 ~7.7 req/s

# 机构名单 —— 默认值与 .claude/agents/investment-research.md 模式① 同步：
# 纳入主动管理机构；默认排除指数巨头（Vanguard / BlackRock / State Street，
# 被动持仓无「主动判断」信号）；Fidelity 主动被动混合，默认不纳入，想看就加行。
institutions:
  - {name: Berkshire Hathaway,        cik: 1067983}
  - {name: Bridgewater Associates,    cik: 1350694}
  - {name: Citadel Advisors,          cik: 1423053}
  - {name: Renaissance Technologies,  cik: 1037389}
  - {name: JPMorgan Chase,            cik: 19617}
  - {name: Goldman Sachs Group,       cik: 886982}
  - {name: Morgan Stanley,            cik: 895421}
  # - {name: Fidelity (MR://混合),     cik: ...}

# FRED 序列 —— 与 SKILL.md §二 的序列表同步（改这里先回那张表核对停更状态）。
fred:
  series:
    - {id: UNRATE,    label: 失业率,                frequency: monthly}
    - {id: PAYEMS,    label: 非农就业(千人),        frequency: monthly}
    - {id: CPIAUCSL,  label: CPI 全项(指数水平),    frequency: monthly}
    - {id: CPILFESL,  label: 核心 CPI(指数水平),    frequency: monthly}
    - {id: FEDFUNDS,  label: 联邦基金有效利率,      frequency: monthly}
    - {id: DTWEXBGS,  label: 美元广义名义指数,      frequency: daily}
    - {id: DEXMAUS,   label: 林吉特/美元汇率,       frequency: daily}

# 市场观察（run_research.py 生产线）—— OpenD 取行情、按 ET 时段切盘前/常规/盘后。
market:
  opend_host: "127.0.0.1"
  opend_port: 11111
  sessions:                      # America/New_York 本地钟
    premarket:  ["04:00", "09:30"]
    regular:    ["09:30", "16:00"]
    postmarket: ["16:00", "20:00"]
  symbols:                       # 大盘 + 11 板块 ETF + 半导体
    - {code: "US.SPY",  label: 标普500 ETF}
    - {code: "US.QQQ",  label: 纳指100 ETF}
    - {code: "US.DIA",  label: 道指 ETF}
    - {code: "US.SOXX", label: 半导体}
    - {code: "US.XLK",  label: 科技}
    - {code: "US.XLF",  label: 金融}
    - {code: "US.XLE",  label: 能源}
    - {code: "US.XLV",  label: 医疗}
    - {code: "US.XLY",  label: 可选消费}
    - {code: "US.XLP",  label: 必需消费}
    - {code: "US.XLI",  label: 工业}
    - {code: "US.XLU",  label: 公用事业}
    - {code: "US.XLB",  label: 材料}
    - {code: "US.XLC",  label: 通信}
    - {code: "US.XLRE", label: 房地产}
  vix:                           # 情绪锚：优先 VIX 指数本体，取不到退 ETN 代理（报告须标口径）
    code: "US.VIX"
    fallback: "US.VIXY"
  weekly_bars: 10                # 周报用的日线根数（含缓冲）
  # 重要日子登记（YYYY-MM-DD = 事件当天；反应在当天盘面，runner 次日北京早晨正好覆盖）。
  # 2026-10-12 联网核实：FOMC 见 federalreserve.gov 官方日历；CPI 见 bls.gov/schedule/news_release/cpi。
  # ⚠️ 过了 2027-01 记得回来续新一年（或删旧加新）。
  event_dates:
    - "2026-10-14"   # CPI（9月数据）08:30 ET
    - "2026-10-28"   # FOMC 议息 + SEP 点阵图 14:00 ET —— 本季最重
    - "2026-11-10"   # CPI（10月数据）08:30 ET
    - "2026-12-09"   # FOMC 年内最后一次议息 14:00 ET
    - "2026-12-10"   # CPI（11月数据）08:30 ET（背靠背，注意与上一条会连两天事件报告）
    - "2027-01-13"   # CPI（12月数据）08:30 ET
